name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  # ---------------------------------------------------------------------------
  # The generator. Runs on plain `node`: tibineko has no package.json, no
  # node_modules and no build step.
  # ---------------------------------------------------------------------------
  generator:
    name: Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Type stripping must be on by default, which needs Node >= 22.6.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Assert there are no Node dependencies
        run: |
          if [ -e package.json ] || [ -e gen/package.json ]; then
            echo "::error::tibineko must stay dependency-free; found a package.json"
            exit 1
          fi
          if [ -d node_modules ] || [ -d gen/node_modules ]; then
            echo "::error::tibineko must stay dependency-free; found node_modules"
            exit 1
          fi

      - name: Generator self-test
        run: node gen/self_test.ts

      - name: Regenerate the example crate
        working-directory: example
        run: node gen.ts

      # Generated Rust is committed, so it must match the grammar. If this
      # fails, run `node example/gen.ts` and commit the result.
      - name: Committed generated sources are up to date
        run: |
          if ! git diff --exit-code -- \
              example/src/parser/generated_ast.rs \
              example/src/parser/generated_ast_printer.rs \
              example/src/parser/generated_parser.rs \
              example/src/tokenizer/generated_tokenmap.rs; then
            echo "::error::generated sources are stale; run 'node example/gen.ts' and commit"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The example crate: unit tests (in-crate) and integration tests (tests/).
  #
  # Failures are re-emitted as workflow annotations, because the raw log is
  # easier to miss than a red ❌ with the compiler message attached.
  # ---------------------------------------------------------------------------
  example:
    name: Example crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example

      - name: Build
        working-directory: example
        run: |
          set +e
          cargo build --color=never 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Errors first, then their locations, then the tail: warnings must
            # not crowd the real failures out of the annotation list.
            grep -E '^error' /tmp/build.log | head -40 | while IFS= read -r line; do
              printf '::error title=build error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
            grep -E '^ *--> ' /tmp/build.log | head -40 | while IFS= read -r line; do
              printf '::error title=build location::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
            tail -40 /tmp/build.log | while IFS= read -r line; do
              printf '::error title=build log tail::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
          fi
          exit "$status"

      - name: Unit tests
        working-directory: example
        run: |
          set +e
          cargo test --lib --color=never 2>&1 | tee /tmp/unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^error(\[E[0-9]+\])?:|^test .* FAILED$|^---- .* stdout ----|panicked at|assertion .*failed|^ *--> ' /tmp/unit.log \
              | head -80 \
              | while IFS= read -r line; do
                  printf '::error title=cargo test --lib::%s\n' \
                    "$(printf '%s' "$line" | sed 's/%/%25/g')"
                done
          fi
          exit "$status"

      - name: Integration tests
        working-directory: example
        run: |
          set +e
          cargo test --test parse --color=never 2>&1 | tee /tmp/integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^error(\[E[0-9]+\])?:|^test .* FAILED$|^---- .* stdout ----|panicked at|assertion .*failed|^ *--> ' /tmp/integration.log \
              | head -80 \
              | while IFS= read -r line; do
                  printf '::error title=cargo test --test parse::%s\n' \
                    "$(printf '%s' "$line" | sed 's/%/%25/g')"
                done
          fi
          exit "$status"

      - name: Test summary
        working-directory: example
        run: cargo test --color=never

  # ---------------------------------------------------------------------------
  # Lints. Advisory for now: the generated sources are not rustfmt-formatted
  # and clippy has not been run over them before. Promote to required once
  # clean.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example

      - name: Clippy
        working-directory: example
        run: |
          set +e
          cargo clippy --all-targets --color=never -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^error(\[E[0-9]+\])?:|^ *--> ' /tmp/clippy.log \
              | head -80 \
              | while IFS= read -r line; do
                  printf '::error title=clippy::%s\n' \
                    "$(printf '%s' "$line" | sed 's/%/%25/g')"
                done
          fi
          exit "$status"

      - name: Formatting
        working-directory: example
        run: cargo fmt --all -- --check
